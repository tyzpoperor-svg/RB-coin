<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RB Coin - Tap to Earn</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }
        #app { max-width: 480px; margin: 0 auto; padding: 15px; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #e94560; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .level-badge { background: #e94560; padding: 5px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }

        /* Balance */
        .balance-container { text-align: center; margin: 20px 0; }
        .balance { font-size: 40px; font-weight: bold; color: #ffd700; }

        /* Energy */
        .energy-bar { height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
        .energy-fill { height: 100%; background: #e94560; transition: width 0.3s; }

        /* Coin */
        .coin-container { display: flex; justify-content: center; margin: 30px 0; }
        .tap-coin {
            width: 180px; height: 180px; border-radius: 50%;
            background: radial-gradient(circle, #ffd700, #cc8400);
            display: flex; align-items: center; justify-content: center;
            font-size: 70px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(255,215,0,0.3);
            transition: transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .tap-coin:active { transform: scale(0.93); }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .stat-card { background: #2a2a3e; padding: 12px; border-radius: 10px; text-align: center; }
        .stat-value { font-size: 18px; font-weight: bold; color: #ffd700; }
        .stat-label { font-size: 12px; color: #aaa; }

        /* Boosts */
        .boost-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .boost-card { background: #2a2a3e; padding: 15px; border-radius: 10px; text-align: center; }
        .buy-btn { background: #e94560; border: none; color: white; padding: 8px 15px; border-radius: 15px; cursor: pointer; margin-top: 10px; width: 100%; }

        /* Tasks */
        .task-card { background: #2a2a3e; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .task-btn { background: #4CAF50; color: white; border: none; padding: 8px 15px; border-radius: 15px; cursor: pointer; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100; }
        .modal.active { display: flex; }
        .modal-content { background: #1a1a2e; border-radius: 15px; padding: 20px; max-width: 350px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .close-btn { float: right; cursor: pointer; font-size: 20px; }

        /* Toast */
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 20px; z-index: 200; }
        .toast.success { background: #4CAF50; }
        .toast.error { background: #f44336; }

        /* Preloader */
        .preloader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .loader { width: 50px; height: 50px; border: 5px solid #333; border-top-color: #e94560; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Preloader -->
    <div class="preloader" id="preloader">
        <div class="loader"></div>
    </div>

    <!-- Main App -->
    <div id="app">
        <!-- Header -->
        <div class="header">
            <div class="avatar">😎</div>
            <div>
                <div id="username" style="font-weight: bold;">Player</div>
                <div style="font-size: 12px; color: #aaa;">Уровень <span id="level">1</span></div>
            </div>
            <button class="level-badge" onclick="showAchievements()">🏆 0</button>
        </div>

        <!-- Balance -->
        <div class="balance-container">
            <div style="color: #aaa; font-size: 13px;">Баланс (RB)</div>
            <div class="balance" id="balance">0</div>
        </div>

        <!-- Energy -->
        <div style="margin: 15px 0;">
            <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px;">
                <span>⚡ Энергия</span>
                <span><span id="energy">1000</span>/1000</span>
            </div>
            <div class="energy-bar">
                <div class="energy-fill" id="energyBar" style="width: 100%;"></div>
            </div>
        </div>

        <!-- Coin -->
        <div class="coin-container">
            <div class="tap-coin" id="tapCoin">🪙</div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="clickPower">1</div>
                <div class="stat-label">За тап</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalClicks">0</div>
                <div class="stat-label">Тапов</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="passiveIncome">0</div>
                <div class="stat-label">В час</div>
            </div>
        </div>

        <!-- Boosts -->
        <h3 style="margin-bottom: 10px;">🚀 Бусты</h3>
        <div class="boost-grid">
            <div class="boost-card">
                <div style="font-size: 30px;">👆</div>
                <div>Сила тапа</div>
                <div style="color: #ffd700;">Ур. <span id="tapLevel">1</span></div>
                <div style="font-size: 12px; color: #aaa;">Цена: <span id="tapCost">100</span></div>
                <button class="buy-btn" onclick="upgradeTap()">Улучшить</button>
            </div>
            <div class="boost-card">
                <div style="font-size: 30px;">⚡</div>
                <div>Макс. энергия</div>
                <div style="color: #ffd700;">Ур. <span id="energyLevel">1</span></div>
                <div style="font-size: 12px; color: #aaa;">Цена: <span id="energyCost">200</span></div>
                <button class="buy-btn" onclick="upgradeEnergy()">Улучшить</button>
            </div>
        </div>

        <!-- Tasks -->
        <h3 style="margin: 20px 0 10px;">📋 Задания</h3>
        <div id="tasksContainer">
            <div class="task-card">
                <div>
                    <div>Подписаться на канал</div>
                    <div style="color: #ffd700; font-size: 13px;">+500 RB</div>
                </div>
                <button class="task-btn" onclick="completeTask(0)">Выполнить</button>
            </div>
            <div class="task-card">
                <div>
                    <div>Пригласить друга</div>
                    <div style="color: #ffd700; font-size: 13px;">+1000 RB</div>
                </div>
                <button class="task-btn" onclick="completeTask(1)">Выполнить</button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">✖</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ============ ДАННЫЕ ИГРОКА ============
        let gameData = {
            balance: 0,
            clickPower: 1,
            energy: 1000,
            maxEnergy: 1000,
            totalClicks: 0,
            tapLevel: 1,
            energyLevel: 1,
            tasks: [false, false],
            achievements: []
        };

        const TAP_COST = 100;
        const ENERGY_COST = 200;

        // ============ ЗАГРУЗКА ============
        window.onload = function() {
            loadGame();
            setTimeout(function() {
                document.getElementById('preloader').style.display = 'none';
            }, 500);
        };

        function loadGame() {
            let saved = localStorage.getItem('rbcoin');
            if (saved) {
                gameData = JSON.parse(saved);
            }
            updateUI();
        }

        function saveGame() {
            localStorage.setItem('rbcoin', JSON.stringify(gameData));
        }

        // ============ ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ============
        function updateUI() {
            document.getElementById('balance').textContent = gameData.balance.toLocaleString();
            document.getElementById('clickPower').textContent = gameData.clickPower;
            document.getElementById('energy').textContent = Math.floor(gameData.energy);
            document.getElementById('energyBar').style.width = (gameData.energy / gameData.maxEnergy * 100) + '%';
            document.getElementById('totalClicks').textContent = gameData.totalClicks.toLocaleString();
            document.getElementById('tapLevel').textContent = gameData.tapLevel;
            document.getElementById('energyLevel').textContent = gameData.energyLevel;
            document.getElementById('tapCost').textContent = TAP_COST * gameData.tapLevel;
            document.getElementById('energyCost').textContent = ENERGY_COST * gameData.energyLevel;
            document.getElementById('passiveIncome').textContent = gameData.clickPower * 100;
            document.getElementById('level').textContent = Math.floor(gameData.totalClicks / 100) + 1;
        }

        // ============ ТАП ПО МОНЕТЕ ============
        document.getElementById('tapCoin').addEventListener('click', function(e) {
            if (gameData.energy >= 1) {
                gameData.balance += gameData.clickPower;
                gameData.energy -= 1;
                gameData.totalClicks++;
                showTapEffect(e.clientX, e.clientY, '+' + gameData.clickPower);
                updateUI();
                saveGame();
            } else {
                showToast('Нет энергии! Подожди ⏳', 'error');
            }
        });

        // Эффект при тапе
        function showTapEffect(x, y, text) {
            let el = document.createElement('div');
            el.textContent = text;
            el.style.cssText = 'position:fixed;font-size:24px;font-weight:bold;color:#ffd700;pointer-events:none;z-index:999;';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(function() {
                el.style.transition = 'all 1s';
                el.style.opacity = '0';
                el.style.transform = 'translateY(-100px)';
            }, 10);
            setTimeout(function() { el.remove(); }, 1000);
        }

        // ============ УЛУЧШЕНИЯ ============
        function upgradeTap() {
            let cost = TAP_COST * gameData.tapLevel;
            if (gameData.balance >= cost) {
                gameData.balance -= cost;
                gameData.clickPower++;
                gameData.tapLevel++;
                showToast('Сила тапа улучшена! 🎉', 'success');
                updateUI();
                saveGame();
            } else {
                showToast('Недостаточно RB! ❌', 'error');
            }
        }

        function upgradeEnergy() {
            let cost = ENERGY_COST * gameData.energyLevel;
            if (gameData.balance >= cost) {
                gameData.balance -= cost;
                gameData.maxEnergy += 500;
                gameData.energyLevel++;
                showToast('Макс. энергия увеличена! ⚡', 'success');
                updateUI();
                saveGame();
            } else {
                showToast('Недостаточно RB! ❌', 'error');
            }
        }

        // ============ ЗАДАНИЯ ============
        function completeTask(index) {
            if (gameData.tasks[index]) {
                showToast('Задание уже выполнено!', 'error');
                return;
            }
            gameData.tasks[index] = true;
            if (index === 0) {
                gameData.balance += 500;
            } else if (index === 1) {
                gameData.balance += 1000;
            }
            showToast('Задание выполнено! +RB 🎁', 'success');
            updateUI();
            saveGame();
        }

        // ============ МОДАЛКА ============
        function showModal(content) {
            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // ============ ДОСТИЖЕНИЯ ============
        function showAchievements() {
            let content = '<h2>🏆 Достижения</h2><br>';
            if (gameData.totalClicks >= 100) {
                content += '<div>💯 Сделано 100 тапов ✅</div>';
            } else {
                content += '<div>💯 Сделать 100 тапов (Осталось: ' + (100 - gameData.totalClicks) + ')</div>';
            }
            if (gameData.balance >= 1000) {
                content += '<div>💰 Заработать 1000 RB ✅</div>';
            } else {
                content += '<div>💰 Заработать 1000 RB (Осталось: ' + (1000 - gameData.balance) + ')</div>';
            }
            if (gameData.tapLevel >= 5) {
                content += '<div>👆 Улучшить тап до 5 ур. ✅</div>';
            } else {
                content += '<div>👆 Улучшить тап до 5 ур.</div>';
            }
            showModal(content);
        }

        // ============ ТОСТ-УВЕДОМЛЕНИЕ ============
        function showToast(text, type) {
            let toast = document.createElement('div');
            toast.className = 'toast ' + (type || '');
            toast.textContent = text;
            document.body.appendChild(toast);
            setTimeout(function() { toast.remove(); }, 2000);
        }

        // ============ ВОССТАНОВЛЕНИЕ ЭНЕРГИИ ============
        setInterval(function() {
            if (gameData.energy < gameData.maxEnergy) {
                gameData.energy += gameData.maxEnergy * 0.01; // 1% от макс. каждые 3 сек
                if (gameData.energy > gameData.maxEnergy) {
                    gameData.energy = gameData.maxEnergy;
                }
                updateUI();
                saveGame();
            }
        }, 3000);
    </script>
</body>
</html>
