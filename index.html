<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма обратной связи</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            display: none;
            font-weight: 500;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status-message.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📩 Свяжитесь с нами</h2>

        <form id="contactForm">
            <div class="form-group">
                <label for="name">Ваше имя</label>
                <input type="text" id="name" placeholder="Иван Иванов" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label for="message">Сообщение</label>
                <textarea id="message" placeholder="Введите ваше сообщение..." required></textarea>
            </div>

            <button type="submit" id="submitBtn">Отправить</button>

            <div id="statusMessage" class="status-message"></div>
        </form>
    </div>

    <script>
        // Здесь вставляем ваши данные
        const TELEGRAM_BOT_TOKEN = '8709677811:AAFVjpk9CPHrORBnMjzoO5Vte24XDAa6L8w';
        const TELEGRAM_CHAT_ID = '5612357520';

        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;

            // Проверка заполнения
            if (!name || !email || !message) {
                showMessage('Пожалуйста, заполните все поля', 'error');
                return;
            }

            // Проверка email
            if (!email.includes('@')) {
                showMessage('Пожалуйста, введите корректный email', 'error');
                return;
            }

            // Блокируем кнопку
            submitBtn.disabled = true;
            showMessage('Отправка...', 'loading');

            // Формируем текст сообщения
            const text = `📋 Новая заявка!\n\n` +
                        `👤 Имя: ${name}\n` +
                        `📧 Email: ${email}\n` +
                        `💬 Сообщение:\n${message}`;

            try {
                // Отправляем в Telegram
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: text
                    })
                });

                if (response.ok) {
                    showMessage('✅ Сообщение отправлено! Мы свяжемся с вами.', 'success');
                    form.reset();
                } else {
                    throw new Error('Ошибка отправки');
                }
            } catch (error) {
                showMessage('❌ Ошибка отправки. Попробуйте ещё раз.', 'error');
            } finally {
                submitBtn.disabled = false;
            }
        });

        function showMessage(text, type) {
            statusMessage.textContent = text;
            statusMessage.className = 'status-message ' + type;
        }
    </script>
</body>
</html>
