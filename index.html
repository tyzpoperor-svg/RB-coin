<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💰 Coin Clicker - Telegram Mini App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .page-container {
            display: flex;
            width: 200%;
            height: 100%;
            transition: transform 0.3s ease;
        }

        .page {
            width: 50%;
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        /* ====== СТИЛИ ДЛЯ ПЕРВОЙ СТРАНИЦЫ (КЛИКЕР) ====== */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            margin-bottom: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            overflow: hidden;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-name {
            font-size: 16px;
            font-weight: 600;
        }

        .stats {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .coins-display {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
        }

        .coins-icon {
            font-size: 28px;
        }

        .energy-display {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
        }

        .energy-bar {
            width: 100px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #f093fb, #f5576c);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .coin-container {
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            margin: 20px 0;
        }

        .coin {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffd700, #ffb700 50%, #ff8c00);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3), inset 0 -10px 20px rgba(0, 0, 0, 0.1), inset 0 10px 20px rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            transition: transform 0.1s ease;
            position: relative;
            border: 8px solid rgba(255, 215, 0, 0.5);
        }

        .coin::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
            z-index: -1;
        }

        .coin:active {
            transform: scale(0.9);
        }

        .tap-animation {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.5);
            }
        }

        .boost-section {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .boost-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .boost-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .boost-card {
            padding: 15px 10px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .boost-card:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .boost-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .boost-emoji {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .boost-name {
            font-size: 12px;
            text-align: center;
            margin-bottom: 5px;
        }

        .boost-price {
            font-size: 14px;
            font-weight: bold;
            color: #ffd700;
        }

        /* ====== СТИЛИ ДЛЯ ВТОРОЙ СТРАНИЦЫ (ССЫЛКИ) ====== */
        .referral-section {
            width: 100%;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            margin-top: 20px;
        }

        .referral-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
        }

        .referral-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .referral-link-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .referral-input-group {
            display: flex;
            gap: 10px;
        }

        .referral-link-input {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            outline: none;
        }

        .copy-button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .copy-button:hover {
            transform: scale(1.05);
        }

        .auto-collect {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 10px;
        }

        .auto-collect-button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .auto-collect-button:hover {
            transform: scale(1.05);
        }

        .auto-collect-button.active {
            background: linear-gradient(135deg, #f44336, #e53935);
        }

        /* ====== ДОПОЛНИТЕЛЬНЫЕ СТИЛИ ====== */
        .swipe-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            z-index: 100;
            pointer-events: none;
        }

        .telegram-button {
            margin-top: auto;
            padding: 15px;
            background: #0088cc;
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .telegram-button:hover {
            background: #0077b5;
            transform: scale(1.02);
        }

        @media (max-width: 768px) {
            .coin {
                width: 150px;
                height: 150px;
                font-size: 45px;
            }

            .coin-container {
                width: 200px;
                height: 200px;
            }

            h1 {
                font-size: 1.8em;
            }

            .boost-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <div class="page-container" id="pageContainer">
            <!-- Первая страница: Кликер -->
            <div class="page" id="clickerPage">
                <div class="header">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">👤</div>
                        <div class="user-name" id="userName">Пользователь</div>
                    </div>
                    <div class="settings-icon" onclick="shareApp()">📤</div>
                </div>

                <div class="stats">
                    <div class="coins-display">
                        <span class="coins-icon">💰</span>
                        <span id="coinsCount">0.00</span>
                    </div>
                    <div class="energy-display">
                        <span>⚡</span>
                        <div class="energy-bar">
                            <div class="energy-fill" id="energyFill" style="width: 100%"></div>
                        </div>
                        <span id="energyCount">100</span>
                    </div>
                </div>

                <div class="coin-container" id="coinContainer">
                    <div class="coin">🪙</div>
                </div>

                <div class="boost-section">
                    <div class="boost-title">🚀 Бусты</div>
                    <div class="boost-grid">
                        <div class="boost-card" id="boostEnergy" onclick="buyBoost('energy')">
                            <span class="boost-emoji">⚡</span>
                            <span class="boost-name">Макс. энергия</span>
                            <span class="boost-price" id="energyBoostPrice">💰 50</span>
                        </div>
                        <div class="boost-card" id="boostRecharge" onclick="buyBoost('recharge')">
                            <span class="boost-emoji">🔋</span>
                            <span class="boost-name">Восстановление</span>
                            <span class="boost-price" id="rechargeBoostPrice">💰 30</span>
                        </div>
                        <div class="boost-card" id="boostMultiplier" onclick="buyBoost('multiplier')">
                            <span class="boost-emoji">✨</span>
                            <span class="boost-name">Множитель x2</span>
                            <span class="boost-price" id="multiplierBoostPrice">💰 100</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Вторая страница: Ссылки -->
            <div class="page" id="referralPage">
                <h1 style="margin: 20px 0; font-size: 2em;">👥 Реферальная система</h1>

                <div class="referral-section">
                    <div class="referral-title">📊 Статистика</div>
                    <div class="referral-stats">
                        <div class="stat-item">
                            <div class="stat-value" id="referralCount">0</div>
                            <div class="stat-label">Приглашено</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="referralEarnings">0</div>
                            <div class="stat-label">Заработано</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="totalEarnings">0</div>
                            <div class="stat-label">Всего монет</div>
                        </div>
                    </div>
                </div>

                <div class="referral-section">
                    <div class="referral-title">🔗 Ваша ссылка</div>
                    <div class="referral-link-container">
                        <div class="referral-input-group">
                            <input type="text" class="referral-link-input" id="referralLink" readonly>
                            <button class="copy-button" onclick="copyReferralLink()">📋 Копировать</button>
                        </div>
                        <button class="copy-button" onclick="shareReferralLink()" style="background: linear-gradient(135deg, #0088cc, #005a8c);">
                            📤 Поделиться в Telegram
                        </button>
                    </div>
                </div>

                <div class="referral-section">
                    <div class="referral-title">⚙️ Автосбор</div>
                    <div class="auto-collect">
                        <div>
                            <div>💰 Автосбор: <span id="autoCollectStatus">Выключен</span></div>
                            <small style="color: rgba(255,255,255,0.7);">Собирает 1 монету в минуту</small>
                        </div>
                        <button class="auto-collect-button" id="autoCollectButton" onclick="toggleAutoCollect()">
                            Включить (💰 500)
                        </button>
                    </div>
                </div>

                <button class="telegram-button" onclick="openTelegram()">
                    📱 Открыть в Telegram
                </button>
            </div>
        </div>
    </div>

    <div class="swipe-indicator">← Свайп влево для перехода →</div>
<script>
    // Telegram Mini App API
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.disableVerticalSwipes();

    // ====== СОСТОЯНИЕ ПРИЛОЖЕНИЯ ======
    let state = {
        coins: 0,
        energy: 100,
        maxEnergy: 100,
        multiplier: 1,
        referrals: 0,
        referralEarnings: 0,
        autoCollect: false,
        lastSaveTime: Date.now(),
        lastEnergyRegen: Date.now(),
        userId: null,
        username: 'Пользователь',
        isPremium: false,
        boostLevels: {
            energy: 1,
            recharge: 1,
            multiplier: 1
        },
        boostCosts: {
            energy: 50,
            recharge: 30,
            multiplier: 100
        }
    };

    // ====== ТЕЛЕГРАМ ИНИЦИАЛИЗАЦИЯ ======
    function initTelegram() {
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            state.userId = user.id;
            state.username = user.first_name || 'Пользователь';
            state.isPremium = user.is_premium || false;

            // Обновляем UI
            document.getElementById('userName').textContent = state.username;

            if (user.photo_url) {
                const avatar = document.getElementById('userAvatar');
                avatar.innerHTML = `<img src="${user.photo_url}" alt="avatar">`;
            } else if (user.first_name) {
                document.getElementById('userAvatar').textContent = user.first_name.charAt(0).toUpperCase();
            }

            // Загружаем данные пользователя из Telegram Cloud Storage
            loadUserData();
        }
    }

    // ====== ТЕЛЕГРАМ КЛАУД ХРАНИЛИЩЕ ======
    async function saveUserData() {
        const data = JSON.stringify(state);
        try {
            if (tg.CloudStorage) {
                await tg.CloudStorage.setItem('userData', data);
            }
        } catch (error) {
            console.error('Ошибка сохранения:', error);
        }
        // Также сохраняем в localStorage как резервную копию
        localStorage.setItem('coinClickerData', data);
    }

    async function loadUserData() {
        try {
            let data = null;
            if (tg.CloudStorage) {
                data = await tg.CloudStorage.getItem('userData');
            }
            if (!data) {
                data = localStorage.getItem('coinClickerData');
            }

            if (data) {
                const savedState = JSON.parse(data);
                state = { ...state, ...savedState };
                updateUI();
                checkAutoCollect();
            }
        } catch (error) {
            console.error('Ошибка загрузки:', error);
        }
    }

    // ====== УПРАВЛЕНИЕ КЛИКАМИ ======
    function handleCoinClick(event) {
        if (state.energy < 1) return;

        // Уменьшаем энергию
        state.energy -= 1;

        // Вычисляем награду
        const reward = 0.5 * state.multiplier;
        state.coins += reward;

        // Анимация
        createTapAnimation(event, reward);
        animateCoin();

        // Обновляем UI
        updateUI();
        saveUserData();

        // Вибрация для Telegram
        if (navigator.vibrate) {
            navigator.vibrate(10);
        }
        tg.HapticFeedback.impactOccurred('light');
    }

    function createTapAnimation(event, reward) {
        const coinContainer = document.getElementById('coinContainer');
        const rect = coinContainer.getBoundingClientRect();

        // Создаем элемент анимации
        const tapElement = document.createElement('div');
        tapElement.className = 'tap-animation';
        tapElement.textContent = `+${reward.toFixed(1)}`;
        tapElement.style.left = (event.clientX - rect.left) + 'px';
        tapElement.style.top = (event.clientY - rect.top) + 'px';

        // Случайное смещение
        tapElement.style.transform = `translateX(${Math.random() * 40 - 20}px)`;

        coinContainer.appendChild(tapElement);

        // Удаляем после анимации
        setTimeout(() => {
            tapElement.remove();
        }, 1000);
    }

    function animateCoin() {
        const coin = document.querySelector('.coin');
        coin.style.transform = 'scale(0.95)';
        setTimeout(() => {
            coin.style.transform = 'scale(1)';
        }, 100);
    }

    // ====== БУСТЫ ======
    function buyBoost(type) {
        const cost = state.boostCosts[type];

        if (state.coins < cost) {
            tg.showAlert('Недостаточно монет!');
            return;
        }

        state.coins -= cost;

        switch(type) {
            case 'energy':
                state.maxEnergy += 50;
                state.energy = state.maxEnergy;
                state.boostCosts.energy = Math.floor(cost * 1.5);
                break;
            case 'recharge':
                state.energy = state.maxEnergy;
                state.boostCosts.recharge = Math.floor(cost * 1.5);
                break;
            case 'multiplier':
                state.multiplier *= 2;
                state.boostCosts.multiplier = Math.floor(cost * 2);
                break;
        }

        updateUI();
        saveUserData();
        tg.HapticFeedback.notificationOccurred('success');
    }

    // ====== ЭНЕРГИЯ ======
    function regenEnergy() {
        const now = Date.now();
        const timePassed = (now - state.lastEnergyRegen) / 1000;
        const energyRegen = Math.floor(timePassed * 0.5); // 0.5 энергии в секунду

        if (energyRegen > 0 && state.energy < state.maxEnergy) {
            state.energy = Math.min(state.energy + energyRegen, state.maxEnergy);
            state.lastEnergyRegen = now;
            updateUI();
        }

        if (state.energy >= state.maxEnergy) {
            state.lastEnergyRegen = now;
        }
    }

    // ====== СВАЙП НАВИГАЦИЯ ======
    let startX = 0;
    let startY = 0;
    let isSwiping = false;

    function initSwipe() {
        const appContainer = document.getElementById('appContainer');

        appContainer.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            isSwiping = true;
        });

        appContainer.addEventListener('touchmove', (e) => {
            if (!isSwiping) return;

            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;

            const diffX = currentX - startX;
            const diffY = currentY - startY;

            // Только горизонтальные свайпы
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                e.preventDefault();
                const pageContainer = document.getElementById('pageContainer');
                const currentTransform = parseFloat(getComputedStyle(pageContainer).transform.split(',')[4]) || 0;

                if (diffX < 0 && currentTransform === 0) {
                    pageContainer.style.transform = 'translateX(-50%)';
                } else if (diffX > 0 && currentTransform !== 0) {
                    pageContainer.style.transform = 'translateX(0%)';
                }
                isSwiping = false;
            }
        });

        appContainer.addEventListener('touchend', () => {
            isSwiping = false;
        });
    }

    // ====== РЕФЕРАЛЬНАЯ СИСТЕМА ======
    function initReferralSystem() {
        const referralLink = document.getElementById('referralLink');
        const botUsername = 'RB_coin_official_bot'; // Ваш бот
        const startParam = state.userId || 'default';

        referralLink.value = `https://t.me/${botUsername}?start=${startParam}`;

        // Обработка start параметра
        if (tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
            const referrerId = tg.initDataUnsafe.start_param;
            if (referrerId && referrerId !== String(state.userId)) {
                state.referrals += 1;
                state.referralEarnings += 10; // Бонус за реферала
                state.coins += 10;
                updateUI();
                saveUserData();
                tg.showAlert('Вы получили 10 монет за приглашение!');
            }
        }
    }

    async function copyReferralLink() {
        const referralLink = document.getElementById('referralLink');

        try {
            if (navigator.clipboard) {
                await navigator.clipboard.writeText(referralLink.value);
                tg.showAlert('Ссылка скопирована!');
            } else {
                referralLink.select();
                document.execCommand('copy');
                tg.showAlert('Ссылка скопирована!');
            }
        } catch (error) {
            console.error('Ошибка копирования:', error);
            tg.showAlert('Ошибка копирования');
        }
    }

    function shareReferralLink() {
        const referralLink = document.getElementById('referralLink');
        const shareText = `💰 Присоединяйся ко мне в Coin Clicker! Зарабатывай монеты и получай бонусы!\n\n🔗 ${referralLink.value}`;

        if (tg.openTelegramLink) {
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(referralLink.value)}&text=${encodeURIComponent(shareText)}`);
        } else {
            window.open(`https://t.me/share/url?url=${encodeURIComponent(referralLink.value)}&text=${encodeURIComponent(shareText)}`, '_blank');
        }
    }

    // ====== АВТОСБОР ======
    function toggleAutoCollect() {
        if (!state.autoCollect) {
            const cost = 500;
            if (state.coins < cost) {
                tg.showAlert('Недостаточно монет для покупки автосбора!');
                return;
            }
            state.coins -= cost;
            state.autoCollect = true;
            document.getElementById('autoCollectButton').textContent = 'Выключить';
            document.getElementById('autoCollectButton').classList.add('active');
            document.getElementById('autoCollectStatus').textContent = 'Включен';
            tg.HapticFeedback.notificationOccurred('success');
        } else {
            state.autoCollect = false;
            document.getElementById('autoCollectButton').textContent = 'Включить (💰 500)';
            document.getElementById('autoCollectButton').classList.remove('active');
            document.getElementById('autoCollectStatus').textContent = 'Выключен';
        }

        updateUI();
        saveUserData();
    }

    function checkAutoCollect() {
        if (state.autoCollect) {
            const now = Date.now();
            const timePassed = (now - state.lastSaveTime) / 1000;
            const collected = Math.floor(timePassed / 60); // 1 монета в минуту

            if (collected > 0) {
                state.coins += collected;
                state.lastSaveTime = now;
                updateUI();
                saveUserData();
            }
        }
    }

    // ====== UI ОБНОВЛЕНИЕ ======
    function updateUI() {
        document.getElementById('coinsCount').textContent = state.coins.toFixed(2);
        document.getElementById('energyCount').textContent = Math.floor(state.energy);

        const energyPercent = (state.energy / state.maxEnergy) * 100;
        document.getElementById('energyFill').style.width = energyPercent + '%';

        // Обновляем бусты
        document.getElementById('energyBoostPrice').textContent = `💰 ${state.boostCosts.energy}`;
        document.getElementById('rechargeBoostPrice').textContent = `💰 ${state.boostCosts.recharge}`;
        document.getElementById('multiplierBoostPrice').textContent = `💰 ${state.boostCosts.multiplier}`;

        // Обновляем реферальную статистику
        document.getElementById('referralCount').textContent = state.referrals;
        document.getElementById('referralEarnings').textContent = state.referralEarnings.toFixed(0);
        document.getElementById('totalEarnings').textContent = state.coins.toFixed(0);

        // Проверяем доступность бустов
        document.getElementById('boostEnergy').classList.toggle('disabled', state.coins < state.boostCosts.energy);
        document.getElementById('boostRecharge').classList.toggle('disabled', state.coins < state.boostCosts.recharge);
        document.getElementById('boostMultiplier').classList.toggle('disabled', state.coins < state.boostCosts.multiplier);
    }

    // ====== ПОДЕЛИТЬСЯ ======
    function shareApp() {
        const shareText = `💰 Я уже собрал ${state.coins.toFixed(0)} монет в Coin Clicker! Присоединяйся и зарабатывай вместе со мной!`;

        if (tg.openTelegramLink) {
            tg.openTelegramLink(`https://t.me/share/url?url=https://t.me/RB_coin_official_bot&text=${encodeURIComponent(shareText)}`);
        }
    }

    // ====== ОТКРЫТЬ TELEGRAM ======
    function openTelegram() {
        if (tg.openTelegramLink) {
            tg.openTelegramLink('https://t.me/RB_coin_official_bot');
        } else {
            window.open('https://t.me/RB_coin_official_bot', '_blank');
        }
    }

    // ====== ИНИЦИАЛИЗАЦИЯ ======
    function init() {
        initTelegram();
        initReferralSystem();
        initSwipe();

        // Обработчик кликов по монете
        document.getElementById('coinContainer').addEventListener('click', handleCoinClick);

        // Регенерация энергии каждую секунду
        setInterval(regenEnergy, 1000);

        // Автосбор каждую минуту
        setInterval(checkAutoCollect, 60000);

        // Сохранение каждые 30 секунд
        setInterval(saveUserData, 30000);

        // Первоначальное обновление UI
        updateUI();
    }

    // Запуск приложения после загрузки страницы
    document.addEventListener('DOMContentLoaded', init);
</script>
