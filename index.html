<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RB Coin - Зарабатывай монеты!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .coin-logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            display: block;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .tagline {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .counter {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }

        .counter-label {
            color: #8B6914;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        #coinCount {
            font-size: 48px;
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .mine-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
            margin-bottom: 15px;
            width: 100%;
        }

        .mine-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(76, 175, 80, 0.5);
        }

        .mine-btn:active {
            transform: scale(0.95);
        }

        .status {
            color: #888;
            font-size: 12px;
            margin-bottom: 20px;
        }

        .referral-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .referral-title {
            color: #333;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .referral-link {
            background: white;
            border: 2px solid #4CAF50;
            border-radius: 10px;
            padding: 10px;
            font-size: 12px;
            color: #333;
            word-break: break-all;
            margin-bottom: 10px;
            user-select: all;
        }

        .copy-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s;
            width: 100%;
        }

        .copy-btn:hover {
            transform: scale(1.02);
        }

        .tg-btn {
            display: inline-block;
            background: linear-gradient(135deg, #0088cc, #0077b5);
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0, 136, 204, 0.4);
        }

        .tg-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 136, 204, 0.5);
        }

        .referral-bonus {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border-radius: 10px;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .footer {
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="rbcoin.png" alt="RB Coin Logo" class="coin-logo" id="coinLogo">

        <h1>🪙 RB COIN</h1>
        <p class="tagline">Зарабатывай монеты кликами!</p>

        <div class="counter">
            <div class="counter-label">Твои монеты:</div>
            <div id="coinCount">0</div>
        </div>

        <button class="mine-btn" onclick="mineCoin()">⛏️ Добыть монету</button>
        <p class="status" id="status"></p>

        <div class="referral-bonus">
            🎁 Приглашай друзей и получай <strong>100 монет</strong> за каждого!
        </div>

        <div class="referral-section">
            <div class="referral-title">👥 Твоя реферальная ссылка:</div>
            <div class="referral-link" id="referralLink">https://tyzpopero-svg.github.io/RB-coin/?ref=your_id</div>
            <button class="copy-btn" onclick="copyReferralLink()">📋 Скопировать ссылку</button>
        </div>

        <a href="https://t.me/+ciz2RtMWH9MzMzUy" target="_blank" class="tg-btn">
            📢 Наш Telegram канал
        </a>

        <p class="footer">© 2026 RB Coin. Все права защищены.</p>
    </div>

    <script>
        // Баланс монет
        let coins = localStorage.getItem('rb_coins') || 0;
        coins = parseInt(coins);
        document.getElementById('coinCount').textContent = coins;

        // Проверка реферальной ссылки
        const urlParams = new URLSearchParams(window.location.search);
        const ref = urlParams.get('ref');

        if (ref && !localStorage.getItem('rb_ref_' + ref)) {
            // Добавляем 100 монет за реферала
            coins += 100;
            localStorage.setItem('rb_coins', coins);
            localStorage.setItem('rb_ref_' + ref, 'true');
            document.getElementById('coinCount').textContent = coins;
            alert('🎉 Ты получил 100 монет за переход по реферальной ссылке!');
        }

        // Функция добычи монет
        let mining = false;
        let clickCount = 0;
        let lastClickTime = 0;

        function mineCoin() {
            const now = Date.now();
            const timeDiff = now - lastClickTime;

            // Минимальное время между кликами - 2 секунды
            if (timeDiff < 2000) {
                document.getElementById('status').textContent = '⏳ Подожди 2 секунды перед следующим кликом!';
                return;
            }

            lastClickTime = now;

            // Увеличиваем счётчик кликов
            clickCount++;

            // Каждый 3-й клик даёт монету
            if (clickCount % 3 === 0) {
                coins += 1;
                localStorage.setItem('rb_coins', coins);
                document.getElementById('coinCount').textContent = coins;
                document.getElementById('status').textContent = '✅ +1 монета!';
            } else {
                document.getElementById('status').textContent = `⏳ Ещё ${3 - (clickCount % 3)} клика до монеты...`;
            }

            // Анимация кнопки
            const btn = document.querySelector('.mine-btn');
            btn.style.transform = 'scale(0.9)';
            setTimeout(() => {
                btn.style.transform = 'scale(1)';
            }, 100);
        }

        // Обновляем реферальную ссылку
        const userId = localStorage.getItem('rb_user_id') || Math.random().toString(36).substr(2, 9);
        localStorage.setItem('rb_user_id', userId);
        document.getElementById('referralLink').textContent = 
            `https://tyzpopero-svg.github.io/RB-coin/?ref=${userId}`;

        // Копирование реферальной ссылки
        function copyReferralLink() {
            const link = document.getElementById('referralLink').textContent;
            navigator.clipboard.writeText(link).then(() => {
                alert('✅ Ссылка скопирована! Отправь её друзьям и получай монеты!');
            }).catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = link;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('✅ Ссылка скопирована!');
            });
        }

        // Функция для обновления монет на странице
        function updateCoins() {
            document.getElementById('coinCount').textContent = coins;
        }
    </script>
</body>
</html>
