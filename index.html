<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 Койн Кликер</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
body { 
    background: #000; 
    overflow: hidden; 
    font-family: Arial, sans-serif; 
    height: 100vh; 
    display: flex; 
    justify-content: center; 
    align-items: center;
}
canvas#stars { position: fixed; top: 0; left: 0; z-index: 0; }
.container { 
    position: relative; z-index: 1; 
    text-align: center; width: 100%; max-width: 400px; 
    padding: 20px; 
}
.star { position: absolute; color: #fff; opacity: 0.8; z-index: 0; }

.coin {
    width: 180px; height: 180px; border-radius: 50%;
    cursor: pointer; transition: transform 0.1s;
    box-shadow: 0 0 30px #ffd700, 0 0 60px #ffd700;
    margin: 20px auto; display: block;
    background: url('https://i.postimg.cc/h4MwsV6n/geekbot-ru-1788098202047.png') center/cover;
}
.coin:active { transform: scale(0.9); }
.stats { color: #fff; margin: 10px; font-size: 24px; }
.stats small { display: block; font-size: 14px; color: #aaa; }
.energy-bar { 
    background: #222; border-radius: 10px; padding: 3px; margin: 15px;
}
.energy-fill { 
    background: linear-gradient(90deg, #00f, #0ff); height: 20px; 
    border-radius: 8px; width: 100%; transition: width 0.3s;
}
.energy-text { color: #fff; margin: 10px; font-size: 14px; }
.btn { 
    background: linear-gradient(45deg, #0088cc, #00bfff); color: #fff; 
    border: none; padding: 12px 20px; border-radius: 10px; 
    margin: 5px; cursor: pointer; font-size: 14px; width: 90%;
}
.btn:hover { opacity: 0.8; }
.btn.telegram { background: linear-gradient(45deg, #229ED9, #50a7e7); }
.btn.referral { background: linear-gradient(45deg, #f093fb, #f5576c); }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="container">
    <h2 style="color:#fff; margin-bottom:5px;">💰 Койн Кликер</h2>

    <!-- Статистика -->
    <div class="stats">
        <span id="coinCount">0.000</span>
        <small>KOIN</small>
    </div>

    <!-- Монета -->
    <div class="coin" id="coin"></div>

    <!-- Энергия -->
    <div class="energy-bar">
        <div class="energy-fill" id="energyFill"></div>
    </div>
    <div class="energy-text" id="energyText">⚡ 10 / 10</div>

    <!-- Реферальная ссылка -->
    <button class="btn referral" onclick="copyReferral()">🎁 Реферальная ссылка</button>
    <small style="color:#aaa; display:block; margin:5px;">Пригласите друзей: <span id="refCount">0</span></small>

    <!-- Привязка кошелька -->
    <button class="btn telegram" onclick="connectWallet()">💎 Привязать TON-кошелёк</button>

    <!-- Регистрация -->
    <button class="btn" onclick="registerAccount()">👤 Регистрация / Привязка Telegram</button>

    <!-- Инфо -->
    <small style="color:#666; display:block; margin-top:15px;">
        ⚡ Энергия: +1 / 5 сек | 🪙 1 тап = 0.001 KOIN
    </small>
</div>

<script>
// ====== ЧАСТЬ 3: ЖИВЫЕ ОБОИ - ПАДАЮЩИЕ ЗВЁЗДЫ ======
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];
let animFrame;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function createStar() {
    return {
        x: Math.random() * canvas.width,
        y: -10,
        speed: Math.random() * 2 + 1,
        size: Math.random() * 2 + 1,
        opacity: Math.random() * 0.8 + 0.2
    };
}

function initStars(count) {
    stars = [];
    for (let i = 0; i < count; i++) {
        const s = createStar();
        s.y = Math.random() * canvas.height;
        stars.push(s);
    }
}

function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${s.opacity})`;
        ctx.fill();
        s.y += s.speed;
        if (s.y > canvas.height + 10) { 
            Object.assign(s, createStar()); 
        }
    });
    animFrame = requestAnimationFrame(drawStars);
}
initStars(150);
drawStars();

// ====== ЧАСТЬ 4: ОСНОВНЫЕ ПЕРЕМЕННЫЕ ИГРЫ ======
const DEFAULT_STATE = {
    coins: 0,
    energy: 10,
    maxEnergy: 10,
    energyRegenTime: 5000,
    refCount: 0,
    telegramId: null,
    username: null,
    registered: false,
    wallet: null
};

let state = { ...DEFAULT_STATE };
let energyRegenTimer = null;
const TAP_VALUE = 0.001;

// Элементы DOM
const coin = document.getElementById('coin');
const coinCount = document.getElementById('coinCount');
const energyText = document.getElementById('energyText');
const energyFill = document.getElementById('energyFill');
const refCountEl = document.getElementById('refCount');

// ====== ЧАСТЬ 5: СОХРАНЕНИЕ И ЗАГРУЗКА ======
function saveState() {
    localStorage.setItem('coinClickerState', JSON.stringify(state));
}

function loadState() {
    const saved = localStorage.getItem('coinClickerState');
    if (saved) {
        try {
            state = { ...DEFAULT_STATE, ...JSON.parse(saved) };
        } catch(e) { console.error('Ошибка загрузки'); }
    }
}

function initTelegram() {
    if (window.Telegram?.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.ready();
        const user = tg.initDataUnsafe?.user;
        if (user) {
            state.telegramId = user.id;
            state.username = user.username || user.first_name;
            state.registered = true;
            saveState();
            syncFromServer();
        }
    }
}

// ====== ЧАСТЬ 6: РЕФЕРАЛЬНАЯ СИСТЕМА ======
function getReferralLink() {
    const userId = state.telegramId || generateLocalId();
    const baseUrl = 'https://t.me/RB_coin_official_bot?start='; // ← Бот: @RB_coin_official_bot
    return baseUrl + userId;
}

function generateLocalId() {
    if (!localStorage.getItem('localUserId')) {
        localStorage.setItem('localUserId', Math.random().toString(36).slice(2));
    }
    return localStorage.getItem('localUserId');
}

function checkReferral() {
    const urlParams = new URLSearchParams(window.location.search);
    const startParam = urlParams.get('start') || 
                      window.Telegram?.WebApp?.initDataUnsafe?.start_param;

    if (startParam) {
        const referrerId = startParam;
        localStorage.setItem('referredBy', referrerId);
        state.refCount++;
        saveState();
        console.log('Вы пришли по рефссылке! Реферер:', referrerId);
        showToast('🎁 Вы пришли по реферальной ссылке!');
    }
}

// ====== ЧАСТЬ 7: ЭНЕРГИЯ И КЛИКИ ======
function updateEnergyDisplay() {
    energyText.textContent = `⚡ ${Math.floor(state.energy)} / ${state.maxEnergy}`;
    energyFill.style.width = (state.energy / state.maxEnergy * 100) + '%';

    if (state.energy <= 0) {
        energyFill.style.background = '#f00';
    } else {
        energyFill.style.background = 'linear-gradient(90deg, #00f, #0ff)';
    }
}

function startEnergyRegen() {
    if (energyRegenTimer) clearInterval(energyRegenTimer);
    energyRegenTimer = setInterval(() => {
        if (state.energy < state.maxEnergy) {
            state.energy += 1;
            saveState();
            updateEnergyDisplay();
        }
    }, state.energyRegenTime);
}

function tapCoin() {
    if (state.energy < 1) {
        showToast('Нет энергии! Подождите ⚡');
        return;
    }

    state.energy -= 1;
    state.coins += TAP_VALUE;
    saveState();

    coinCount.textContent = state.coins.toFixed(3);
    updateEnergyDisplay();

    coin.style.transform = 'scale(0.9)';
    setTimeout(() => { coin.style.transform = 'scale(1)'; }, 100);

    showFloatingNumber('+' + TAP_VALUE);
}

// ====== ЧАСТЬ 8: ДОПОЛНИТЕЛЬНЫЕ ФУНКЦИИ ======
function showFloatingNumber(text) {
    const div = document.createElement('div');
    div.textContent = text;
    div.style.cssText = `
        position: absolute; left: 50%; top: 40%;
        transform: translateX(-50%); color: #ffd700;
        font-size: 24px; font-weight: bold; pointer-events: none;
        z-index: 10; text-shadow: 0 0 10px #ffd700;
        animation: floatUp 1s forwards;
    `;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 1000);
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.textContent = msg;
    toast.style.cssText = `
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px;
        border-radius: 10px; z-index: 100; border: 1px solid #ffd700;
        animation: slideDown 0.3s forwards;
    `;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
}

const style = document.createElement('style');
style.textContent = `
@keyframes floatUp { 
    from { opacity: 1; transform: translate(-50%, 0); }
    to { opacity: 0; transform: translate(-50%, -80px); }
}
@keyframes slideDown {
    from { transform: translate(-50%, -100%); }
    to { transform: translate(-50%, 0); }
}`;
document.head.appendChild(style);

// ====== ЧАСТЬ 9: КОШЕЛЁК И РЕГИСТРАЦИЯ ======
function connectWallet() {
    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.sendData(JSON.stringify({ action: 'connect_wallet' }));
        showToast('Запрос отправлен!');
    } else {
        const wallet = prompt('Введите адрес вашего TON-кошелька:');
        if (wallet) {
            state.wallet = wallet;
            saveState();
            showToast('✅ Кошелёк привязан: ' + wallet.slice(0, 6) + '...');
        }
    }
}

function registerAccount() {
    if (state.registered) {
        showToast('✅ Вы уже авторизованы!');
        return;
    }

    if (window.Telegram?.WebApp) {
        const tg = window.Telegram.WebApp;
        const user = tg.initDataUnsafe?.user;
        if (user) {
            state.telegramId = user.id;
            state.username = user.username || user.first_name;
            state.registered = true;
            saveState();
            showToast('✅ Аккаунт привязан к Telegram!');
        }
    } else {
        const username = prompt('Введите ваш Telegram username (без @):');
        if (username) {
            state.username = username;
            state.registered = true;
            saveState();
            showToast('✅ Аккаунт создан!');
        }
    }
}

function syncFromServer() {
    loadState();
    updateAllUI();
}

// ====== ЧАСТЬ 10: ОБРАБОТЧИКИ И ЗАПУСК ======
function copyReferral() {
    const link = getReferralLink();
    navigator.clipboard.writeText(link).then(() => {
        showToast('🔗 Ссылка скопирована!');
    });
}

function updateAllUI() {
    coinCount.textContent = state.coins.toFixed(3);
    updateEnergyDisplay();
    refCountEl.textContent = state.refCount;
}

coin.addEventListener('click', tapCoin);

loadState();
initTelegram();
checkReferral();
updateAllUI();
startEnergyRegen();

window.addEventListener('beforeunload', () => {
    if (energyRegenTimer) clearInterval(energyRegenTimer);
});
</script>
</body>
</html>
