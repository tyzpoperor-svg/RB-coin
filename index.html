<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RB Coin - Зарабатывай монеты!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Анимированные звёзды */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
            animation: fall linear infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @keyframes fall {
            from {
                transform: translateY(-100%);
                opacity: 1;
            }
            to {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        .container {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            color: #fff;
            font-size: 36px;
            margin-bottom: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .tagline {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
            font-size: 14px;
        }

        .counter {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }

        .counter-label {
            color: #8B6914;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        #coinCount {
            font-size: 42px;
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Кликабельная монета */
        .coin-container {
            position: relative;
            margin: 20px auto;
            width: 200px;
            height: 200px;
            cursor: pointer;
        }

        .coin {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            transition: transform 0.1s;
            user-select: none;
            -webkit-user-drag: none;
        }

        .coin:active {
            transform: scale(0.85);
        }

        .coin-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3) 0%, transparent 70%);
            animation: glow 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes glow {
            0%, 100% {
                opacity: 0.5;
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin: 15px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .progress-fill {
            background: linear-gradient(90deg, #ffd700, #ffaa00);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .status {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            margin-bottom: 20px;
            min-height: 20px;
        }

        .referral-section {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .referral-title {
            color: #fff;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .referral-link {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 10px;
            font-size: 12px;
            color: #fff;
            word-break: break-all;
            margin-bottom: 10px;
            user-select: all;
        }

        .copy-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s;
            width: 100%;
        }

        .copy-btn:hover {
            transform: scale(1.02);
        }

        .tg-btn {
            display: inline-block;
            background: linear-gradient(135deg, #0088cc, #0077b5);
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0, 136, 204, 0.4);
            margin-top: 10px;
        }

        .tg-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 136, 204, 0.5);
        }

        .referral-bonus {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.3), rgba(69, 160, 73, 0.3));
            border: 1px solid rgba(76, 175, 80, 0.5);
            color: white;
            border-radius: 10px;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .footer {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        .particles {
            position: absolute;
            pointer-events: none;
            z-index: 2;
        }

        .particle {
            position: absolute;
            font-size: 24px;
            animation: particleFloat 1s ease-out forwards;
            pointer-events: none;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-50px) scale(0.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Звёздный фон -->
    <div class="stars-container" id="starsContainer"></div>

    <div class="container">
        <h1>🪙 RB COIN</h1>
        <p class="tagline">Тапай по монете и зарабатывай!</p>

        <div class="counter">
            <div class="counter-label">Твои монеты:</div>
            <div id="coinCount">0</div>
        </div>

        <!-- Кликабельная монета -->
        <div class="coin-container" onclick="mineCoin(event)">
            <div class="coin-glow"></div>
            <img src="rbcoin.png" alt="RB Coin" class="coin" id="coin">
        </div>

        <!-- Прогресс до следующей монеты -->
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <p class="status" id="status">Тапай по монете!</p>

        <div class="referral-bonus">
            🎁 Приглашай друзей и получай <strong>100 монет</strong> за каждого!
        </div>

        <div class="referral-section">
            <div class="referral-title">👥 Твоя реферальная ссылка:</div>
            <div class="referral-link" id="referralLink">https://tyzpopero-svg.github.io/RB-coin/?ref=your_id</div>
            <button class="copy-btn" onclick="copyReferralLink()">📋 Скопировать ссылку</button>
        </div>

        <a href="https://t.me/+ciz2RtMWH9MzMzUy" target="_blank" class="tg-btn">
            📢 Наш Telegram канал
        </a>

        <p class="footer">© 2026 RB Coin. Все права защищены.</p>
    </div>

    <script>
        // Баланс монет
        let coins = localStorage.getItem('rb_coins') || 0;
        coins = parseInt(coins);
        document.getElementById('coinCount').textContent = coins;

        // Проверка реферальной ссылки
        const urlParams = new URLSearchParams(window.location.search);
        const ref = urlParams.get('ref');

        if (ref && !localStorage.getItem('rb_ref_' + ref)) {
            coins += 100;
            localStorage.setItem('rb_coins', coins);
            localStorage.setItem('rb_ref_' + ref, 'true');
            document.getElementById('coinCount').textContent = coins;
            alert('🎉 Ты получил 100 монет за переход по реферальной ссылке!');
        }

        // Создание звёзд
        function createStars() {
            const container = document.getElementById('starsContainer');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.animationDuration = (Math.random() * 5 + 3) + 's';
                star.style.animationDelay = Math.random() * 5 + 's';
                star.style.width = (Math.random() * 4 + 2) + 'px';
                star.style.height = star.style.width;
                container.appendChild(star);
            }
        }

        createStars();

        // Функция добычи монет
        let clickCount = 0;
        let lastClickTime = 0;
        const CLICKS_NEEDED = 5; // 5 кликов для монеты
        const COOLDOWN = 5000; // 5 секунд между кликами

        function mineCoin(event) {
            const now = Date.now();
            const timeDiff = now - lastClickTime;

            // Проверка кулдауна
            if (timeDiff < COOLDOWN) {
                const secondsLeft = Math.ceil((COOLDOWN - timeDiff) / 1000);
                document.getElementById('status').textContent = `⏳ Подожди ${secondsLeft} сек...`;
                return;
            }

            lastClickTime = now;

            // Анимация монеты
            const coin = document.getElementById('coin');
            coin.style.transform = 'scale(0.85)';
            setTimeout(() => {
                coin.style.transform = 'scale(1)';
            }, 100);

            // Создание частиц
            if (event) {
                createParticles(event.clientX, event.clientY);
            }

            // Увеличиваем счётчик кликов
            clickCount++;

            // Обновляем прогресс
            const progress = ((clickCount % CLICKS_NEEDED) / CLICKS_NEEDED) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            // Каждый 5-й клик даёт монету
            if (clickCount % CLICKS_NEEDED === 0) {
                coins += 1;
                localStorage.setItem('rb_coins', coins);
                document.getElementById('coinCount').textContent = coins;
                document.getElementById('status').textContent = '✅ +1 монета!';
                document.getElementById('progressFill').style.width = '0%';
            } else {
                const clicksLeft = CLICKS_NEEDED - (clickCount % CLICKS_NEEDED);
                document.getElementById('status').textContent = `⏳ Ещё ${clicksLeft} кликов до монеты...`;
            }
        }

        // Создание частиц при клике
        function createParticles(x, y) {
            const container = document.querySelector('.container');
            const rect = container.getBoundingClientRect();
            const particleContainer = document.createElement('div');
            particleContainer.className = 'particles';
            particleContainer.style.left = (x - rect.left) + 'px';
            particleContainer.style.top = (y - rect.top) + 'px';

            for (let i = 0; i < 5; i++) {
                const particle = document.createElement('span');
                particle.className = 'particle';
                particle.textContent = '✨';
                particle.style.left = (Math.random() - 0.5) * 40 + 'px';
                particle.style.animationDelay = Math.random() * 0.2 + 's';
                particleContainer.appendChild(particle);
            }

            container.appendChild(particleContainer);
            setTimeout(() => {
                particleContainer.remove();
            }, 1000);
        }

        // Обновляем реферальную ссылку
        const userId = localStorage.getItem('rb_user_id') || Math.random().toString(36).substr(2, 9);
        localStorage.setItem('rb_user_id', userId);
        document.getElementById('referralLink').textContent = 
            `https://tyzpopero-svg.github.io/RB-coin/?ref=${userId}`;

        // Копирование реферальной ссылки
        function copyReferralLink() {
            const link = document.getElementById('referralLink').textContent;
            navigator.clipboard.writeText(link).then(() => {
                alert('✅ Ссылка скопирована! Отправь её друзьям и получай монеты!');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = link;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('✅ Ссылка скопирована!');
            });
        }
    </script>
</body>
</html>
