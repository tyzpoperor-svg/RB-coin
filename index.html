<script>
    // Баланс монет
    let coins = parseFloat(localStorage.getItem('rb_coins')) || 0;
    coins = parseFloat(coins.toFixed(2));

    // Авто-майнер
    let hasAutoMiner = localStorage.getItem('rb_auto_miner') === 'true';
    let autoMinerEarned = parseFloat(localStorage.getItem('rb_auto_miner_earned')) || 0;

    // Буст
    let boostActive = false;
    let boostEndTime = parseInt(localStorage.getItem('rb_boost_end')) || 0;
    if (boostEndTime > Date.now()) {
        boostActive = true;
    }

    // Обновление интерфейса
    function updateUI() {
        document.getElementById('coinCount').textContent = coins.toFixed(2);

        // Обновляем статус авто-майнера
        const autoMinerBtn = document.getElementById('autoMinerBtn');
        const autoMinerStatus = document.getElementById('autoMinerStatus');

        if (hasAutoMiner) {
            autoMinerBtn.disabled = true;
            autoMinerBtn.textContent = '✅ Куплено';
            autoMinerStatus.textContent = '⛏️ Добывает: 0.001 монет/мин';
        } else {
            autoMinerBtn.disabled = coins < 1000;
            autoMinerBtn.textContent = coins < 1000 ? '💰 Нужно 1000 монет' : '⚡ Купить за 1000';
            autoMinerStatus.textContent = '';
        }

        // Обновляем статус буста
        const boostStatus = document.getElementById('boostStatus');
        if (boostActive) {
            boostStatus.classList.add('active');
            updateBoostTimer();
        } else {
            boostStatus.classList.remove('active');
        }
    }

    // Обновление таймера буста
    function updateBoostTimer() {
        const boostTimer = document.getElementById('boostTimer');
        const remaining = Math.max(0, boostEndTime - Date.now());
        const seconds = Math.floor(remaining / 1000);
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        boostTimer.textContent = `Осталось: ${minutes}:${secs.toString().padStart(2, '0')}`;

        if (remaining <= 0) {
            boostActive = false;
            localStorage.removeItem('rb_boost_end');
            document.getElementById('boostStatus').classList.remove('active');
            document.getElementById('coinValue').textContent = '💰 +0.01 монета за тап';
        }
    }

    // Функция добычи монет (тап)
    function mineCoin(event) {
        // Определяем награду за тап
        let reward = 0.01;
        if (boostActive) {
            reward = 0.02; // x2 буст
        }

        coins += reward;
        coins = parseFloat(coins.toFixed(2));
        localStorage.setItem('rb_coins', coins.toString());

        // Анимация частиц
        createParticles(event.clientX, event.clientY, `+${reward.toFixed(2)}`);

        // Обновляем UI
        updateUI();

        // Обновляем статус
        document.getElementById('status').textContent = boostActive ? '🔥 Буст активен! +0.02 за тап!' : `+${reward.toFixed(2)} монет!`;

        // Перезапускаем таймер (каждые 5 секунд можно тапать)
        startTimer();
    }

    // Таймер обратного отсчёта
    let timerInterval;
    let timeLeft = 5.0;

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 5.0;
        updateTimerDisplay();

        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                document.getElementById('timer').textContent = '✅ ГОТОВО!';
                document.getElementById('timer').classList.add('ready');
                document.getElementById('status').textContent = 'Тапай! Монета готова!';
            } else {
                updateTimerDisplay();
            }
        }, 100);
    }

    function updateTimerDisplay() {
        document.getElementById('timer').textContent = timeLeft.toFixed(1) + ' сек';
        document.getElementById('timer').classList.remove('ready');
    }

    // Создание частиц при тапе
    function createParticles(x, y, text) {
        const container = document.getElementById('starsContainer');
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.textContent = text;
        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        particle.style.color = '#ffd700';
        particle.style.fontWeight = 'bold';
        container.appendChild(particle);

        setTimeout(() => {
            particle.remove();
        }, 1000);
    }

    // Авто-майнер
    function buyAutoMiner() {
        if (coins >= 1000 && !hasAutoMiner) {
            coins -= 1000;
            coins = parseFloat(coins.toFixed(2));
            hasAutoMiner = true;
            localStorage.setItem('rb_coins', coins.toString());
            localStorage.setItem('rb_auto_miner', 'true');

            // Начинаем автоматическую добычу
            startAutoMining();
            updateUI();

            document.getElementById('status').textContent = '🤖 Авто-майнер куплен!';
            alert('🎉 Поздравляем! Авто-майнер теперь работает за тебя!');
        }
    }

    // Автоматическая добыча
    let autoMinerInterval;

    function startAutoMining() {
        if (!hasAutoMiner || autoMinerInterval) return;

        // Добываем каждую минуту по 0.001
        autoMinerInterval = setInterval(() => {
            if (hasAutoMiner) {
                let earnings = 0.001;
                if (boostActive) {
                    earnings = 0.002; // x2 если буст активен
                }

                coins += earnings;
                coins = parseFloat(coins.toFixed(2));
                localStorage.setItem('rb_coins', coins.toString());

                // Обновляем счётчик заработанного
                autoMinerEarned += earnings;
                localStorage.setItem('rb_auto_miner_earned', autoMinerEarned.toString());

                updateUI();
                document.getElementById('status').textContent = `🤖 Авто-майнер добыл +${earnings.toFixed(3)} монет`;
            }
        }, 60000); // Каждые 60 секунд
    }

    // Проверка и запуск авто-майнера при загрузке
    if (hasAutoMiner) {
        startAutoMining();
    }

    // Система падающих стикеров огонька
    function spawnFireSticker() {
        if (!hasAutoMiner) return; // Только если есть авто-майнер

        // Создаём стикер
        const sticker = document.createElement('div');
        sticker.className = 'fire-sticker';
        sticker.textContent = '🔥';
        sticker.style.left = Math.random() * (window.innerWidth - 100) + 'px';
        sticker.style.animationDuration = (2 + Math.random() * 2) + 's';

        // Показываем уведомление
        const notification = document.getElementById('stickerNotification');
        notification.style.display = 'block';
        setTimeout(() => {
            notification.style.display = 'none';
        }, 3000);

        // Обработчик тапа по стикеру
        sticker.onclick = function(e) {
            e.stopPropagation();
            activateBoost();
            sticker.remove();
        };

        document.body.appendChild(sticker);

        // Удаляем стикер через 5 секунд если не тапнули
        setTimeout(() => {
            if (sticker.parentNode) {
                sticker.remove();
            }
        }, 5000);
    }

    // Активация буста x2
    function activateBoost() {
        boostActive = true;
        boostEndTime = Date.now() + 4 * 60 * 1000; // 4 минуты
        localStorage.setItem('rb_boost_end', boostEndTime.toString());

        // Обновляем интерфейс
        document.getElementById('boostStatus').classList.add('active');
        document.getElementById('coinValue').textContent = '💰 +0.02 монета за тап (x2 буст!)';
        document.getElementById('status').textContent = '🔥 БУСТ АКТИВЕН! x2 монеты!';

        updateUI();
        updateBoostTimer();

        // Показываем уведомление
        alert('🔥 БУСТ АКТИВИРОВАН! x2 монеты на 4 минуты!');
    }

    // Запускаем спавн стикеров каждые 10 минут
    setInterval(() => {
        if (hasAutoMiner) {
            spawnFireSticker();
        }
    }, 600000); // 10 минут в миллисекундах

    // Обновление таймера буста каждую секунду
    setInterval(() => {
        if (boostActive) {
            updateBoostTimer();
        }
    }, 1000);

    // Копирование реферальной ссылки
    function copyReferralLink() {
        const link = document.getElementById('referralLink').textContent;
        navigator.clipboard.writeText(link).then(() => {
            document.getElementById('status').textContent = '✅ Ссылка скопирована!';
            alert('🔗 Реферальная ссылка скопирована!');
        });
    }

    // Генерация звёзд на фоне
    function createStars() {
        const container = document.getElementById('starsContainer');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.animationDuration = (5 + Math.random() * 10) + 's';
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.width = (2 + Math.random() * 4) + 'px';
            star.style.height = star.style.width;
            container.appendChild(star);
        }
    }

    // Инициализация
    createStars();
    updateUI();

    // Проверяем буст при загрузке
    if (boostActive) {
        updateBoostTimer();
        document.getElementById('coinValue').textContent = '💰 +0.02 монета за тап (x2 буст!)';
    }

    // Запускаем таймер при загрузке
    startTimer();
</script>
