<script>
// ====== ЧАСТЬ 1: ОСНОВНЫЕ НАСТРОЙКИ ======
const TAP_VALUE = 0.001; // Сколько даёт один клик
const MAX_ENERGY = 10;   // Максимум энергии
const ENERGY_REGEN_TIME = 5000; // 5 секунд

let state = {
    coins: 0,
    energy: MAX_ENERGY,
    refCount: 0,
    telegramId: null,
    username: null,
    registered: false,
    wallet: null,
    lastUpdate: Date.now()
};

// ====== ЧАСТЬ 2: ИНИЦИАЛИЗАЦИЯ TELEGRAM ======
function initTelegram() {
    if (window.Telegram?.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            state.telegramId = user.id;
            state.username = user.username || user.first_name;
            state.registered = true;
            console.log('Пользователь:', state.username, 'ID:', state.telegramId);
        }

        // Проверяем реферальную ссылку
        const startParam = tg.initDataUnsafe?.start_param;
        if (startParam && startParam !== state.telegramId) {
            // Отправляем на сервер информацию о реферале
            sendReferralToServer(startParam);
        }

        // Загружаем данные с сервера
        loadFromTelegramServer();
    } else {
        // Fallback для браузера (тест)
        console.log('Telegram WebApp не найден, работаем локально');
        loadLocalState();
    }
}

// ====== ЧАСТЬ 3: СИНХРОНИЗАЦИЯ С TELEGRAM CLOUD ======
async function saveToTelegramServer() {
    if (!window.Telegram?.WebApp) return;

    try {
        const data = {
            coins: state.coins,
            refCount: state.refCount,
            wallet: state.wallet,
            lastUpdate: Date.now()
        };

        // Сохраняем в Telegram Cloud Storage
        window.Telegram.WebApp.CloudStorage?.setItem('gameData', JSON.stringify(data));

        // Отправляем через Bot API (если есть сервер)
        if (window.Telegram.WebApp.initDataUnsafe?.user) {
            const userId = window.Telegram.WebApp.initDataUnsafe.user.id;
            await fetch(`https://your-server.com/api/save?user=${userId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => console.log('Сервер недоступен, использую Cloud Storage'));
        }
    } catch (e) {
        console.log('Ошибка сохранения:', e);
    }
}

async function loadFromTelegramServer() {
    if (!window.Telegram?.WebApp) {
        loadLocalState();
        return;
    }

    try {
        // Пытаемся загрузить из Telegram Cloud Storage
        const cloudData = await window.Telegram.WebApp.CloudStorage?.getItem('gameData');
        if (cloudData) {
            const parsed = JSON.parse(cloudData);
            state.coins = parsed.coins || 0;
            state.refCount = parsed.refCount || 0;
            state.wallet = parsed.wallet || null;
        }

        // Пытаемся загрузить с сервера (если есть)
        const userId = window.Telegram.WebApp.initDataUnsafe?.user?.id;
        if (userId) {
            fetch(`https://your-server.com/api/load?user=${userId}`)
                .then(res => res.json())
                .then(data => {
                    if (data) {
                        state.coins = data.coins || 0;
                        state.refCount = data.refCount || 0;
                        state.wallet = data.wallet || null;
                    }
                    updateUI();
                })
                .catch(() => {
                    updateUI();
                });
        } else {
            updateUI();
        }
    } catch (e) {
        console.log('Ошибка загрузки:', e);
        loadLocalState();
        updateUI();
    }
}

// ====== ЧАСТЬ 4: РЕФЕРАЛЬНАЯ СИСТЕМА ======
function getReferralLink() {
    const userId = state.telegramId || generateLocalId();
    const baseUrl = 'https://t.me/RB_coin_official_bot?start='; // ← ВАШ БОТ
    return baseUrl + userId;
}

function generateLocalId() {
    if (!localStorage.getItem('localUserId')) {
        localStorage.setItem('localUserId', 'user_' + Math.random().toString(36).slice(2));
    }
    return localStorage.getItem('localUserId');
}

async function sendReferralToServer(referrerId) {
    if (!window.Telegram?.WebApp) return;

    const user = window.Telegram.WebApp.initDataUnsafe?.user;
    if (!user) return;

    try {
        // Отправляем информацию о реферале
        await fetch(`https://your-server.com/api/referral`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                referrer_id: referrerId,
                new_user_id: user.id,
                username: user.username || user.first_name
            })
        });

        // Показываем бонус
        state.coins += 0.5; // Бонус за реферала
        saveState();
        updateUI();
        showToast('🎁 +0.5 KOIN за переход по реферальной ссылке!');
    } catch (e) {
        console.log('Реферальная система не работает без сервера');
        // Fallback: сохраняем в localStorage
        localStorage.setItem('referredBy', referrerId);
        state.refCount++;
        saveState();
        updateUI();
    }
}

// ====== ЧАСТЬ 5: ЛОКАЛЬНОЕ СОХРАНЕНИЕ (FALLBACK) ======
function saveState() {
    localStorage.setItem('coinClickerState', JSON.stringify(state));
    saveToTelegramServer(); // Также сохраняем в Telegram Cloud
}

function loadLocalState() {
    const saved = localStorage.getItem('coinClickerState');
    if (saved) {
        try {
            state = { ...state, ...JSON.parse(saved) };
        } catch(e) {
            console.error('Ошибка загрузки');
        }
    }
}

// ====== ЧАСТЬ 6: ИГРОВАЯ ЛОГИКА ======
function tapCoin() {
    if (state.energy < 1) {
        showToast('Нет энергии! Подождите ⚡');
        return;
    }

    state.energy -= 1;
    state.coins += TAP_VALUE;

    // Анимация клика
    coin.style.transform = 'scale(0.9)';
    setTimeout(() => { coin.style.transform = 'scale(1)'; }, 100);

    // Плавающий текст
    showFloatingNumber('+' + TAP_VALUE);

    saveState();
    updateUI();
}

function updateEnergy() {
    if (state.energy < MAX_ENERGY) {
        state.energy += 1;
        saveState();
        updateUI();
    }
}

function updateUI() {
    coinCount.textContent = state.coins.toFixed(3);
    energyText.textContent = `⚡ ${Math.floor(state.energy)} / ${MAX_ENERGY}`;
    energyFill.style.width = (state.energy / MAX_ENERGY * 100) + '%';

    if (state.energy <= 0) {
        energyFill.style.background = '#f00';
    } else {
        energyFill.style.background = 'linear-gradient(90deg, #00f, #0ff)';
    }

    refCountEl.textContent = state.refCount;
}

// ====== ЧАСТЬ 7: ДОПОЛНИТЕЛЬНЫЕ ФУНКЦИИ ======
function showFloatingNumber(text) {
    const div = document.createElement('div');
    div.textContent = text;
    div.style.cssText = `
        position: absolute; left: 50%; top: 40%;
        transform: translateX(-50%); color: #ffd700;
        font-size: 24px; font-weight: bold; pointer-events: none;
        z-index: 10; text-shadow: 0 0 10px #ffd700;
        animation: floatUp 1s forwards;
    `;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 1000);
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.textContent = msg;
    toast.style.cssText = `
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px;
        border-radius: 10px; z-index: 100; border: 1px solid #ffd700;
        animation: slideDown 0.3s forwards;
    `;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
}

function copyReferral() {
    const link = getReferralLink();
    navigator.clipboard.writeText(link).then(() => {
        showToast('🔗 Ссылка скопирована!');
    });
}

function connectWallet() {
    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.sendData(JSON.stringify({ action: 'connect_wallet' }));
        showToast('Запрос отправлен!');
    } else {
        const wallet = prompt('Введите адрес вашего TON-кошелька:');
        if (wallet) {
            state.wallet = wallet;
            saveState();
            updateUI();
            showToast('✅ Кошелёк привязан: ' + wallet.slice(0, 6) + '...');
        }
    }
}

function registerAccount() {
    if (state.registered) {
        showToast('✅ Вы уже авторизованы!');
        return;
    }

    if (window.Telegram?.WebApp) {
        const user = window.Telegram.WebApp.initDataUnsafe?.user;
        if (user) {
            state.telegramId = user.id;
            state.username = user.username || user.first_name;
            state.registered = true;
            saveState();
            updateUI();
            showToast('✅ Аккаунт привязан к Telegram!');
        }
    } else {
        const username = prompt('Введите ваш Telegram username (без @):');
        if (username) {
            state.username = username;
            state.registered = true;
            saveState();
            updateUI();
            showToast('✅ Аккаунт создан!');
        }
    }
}

// ====== ЧАСТЬ 8: ЗАПУСК ======
// Элементы DOM
const coin = document.getElementById('coin');
const coinCount = document.getElementById('coinCount');
const energyText = document.getElementById('energyText');
const energyFill = document.getElementById('energyFill');
const refCountEl = document.getElementById('refCount');

// События
coin.addEventListener('click', tapCoin);

// Автовосстановление энергии каждые 5 сек
setInterval(updateEnergy, ENERGY_REGEN_TIME);

// Запуск
initTelegram();
</script>
