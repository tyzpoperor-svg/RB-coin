<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 RB Coin Official - Игра</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #000000 50%, #1a1a2e 100%);
            min-height: 100vh;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Звёздный фон */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: fall linear infinite;
            opacity: 0.8;
        }

        .star:nth-child(even) {
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.8);
        }

        .star:nth-child(3n) {
            width: 1px;
            height: 1px;
        }

        @keyframes fall {
            from {
                transform: translateY(-100px) translateX(0);
                opacity: 1;
            }
            to {
                transform: translateY(calc(100vh + 100px)) translateX(50px);
                opacity: 0;
            }
        }

        /* Огонёк */
        .fire-sticker {
            position: fixed;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff6b35, #ff4500);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.8);
            z-index: 100;
            animation: firePulse 2s ease-in-out infinite;
            transition: transform 0.3s;
        }

        .fire-sticker:hover {
            transform: scale(1.2);
        }

        @keyframes firePulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(255, 69, 0, 0.8);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 69, 0, 1);
            }
        }

        /* Буст эффект */
        .boost-active {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff6b35, #ff4500);
            padding: 10px 20px;
            border-radius: 10px;
            z-index: 200;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(255, 69, 0, 0.5);
            animation: boostPulse 1s ease-in-out infinite;
            display: none;
        }

        .boost-active.show {
            display: block;
        }

        @keyframes boostPulse {
            0%, 100% {
                transform: translateX(-50%) scale(1);
            }
            50% {
                transform: translateX(-50%) scale(1.1);
            }
        }

        .game-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
        }

        .game-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-header h1 {
            font-size: 36px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .balance-display {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 2px solid rgba(243, 156, 18, 0.3);
        }

        .balance-label {
            font-size: 14px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .balance-amount {
            font-size: 48px;
            font-weight: 800;
            color: #f39c12;
            margin-top: 5px;
        }

        .balance-amount span {
            font-size: 20px;
            color: #e67e22;
        }

        .click-button {
            width: 100%;
            padding: 25px;
            font-size: 24px;
            font-weight: 700;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            background: linear-gradient(135deg, #e94560, #c23152);
            color: white;
            transition: all 0.3s;
            margin: 20px 0;
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }

        .click-button:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(233, 69, 96, 0.6);
        }

        .click-button:active {
            transform: scale(0.95);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 10px;
            color: #aaa;
            margin-top: 5px;
        }

        .upgrade-button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .upgrade-button:hover {
            transform: translateY(-2px);
        }

        .message {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .message.error {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        @media (max-width: 480px) {
            .game-container {
                margin: 20px;
                padding: 20px;
            }

            .balance-amount {
                font-size: 36px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .stat-value {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Звёздный фон -->
    <div class="stars-container" id="starsContainer"></div>

    <!-- Индикатор буста -->
    <div class="boost-active" id="boostIndicator">
        🔥 БУСТ x2 АКТИВЕН! Осталось: <span id="boostTime">04:00</span>
    </div>

    <!-- Игровое поле -->
    <div class="game-container">
        <div class="game-header">
            <h1>🎮 RB COIN</h1>
        </div>

        <!-- Баланс -->
        <div class="balance-display">
            <div class="balance-label">Баланс</div>
            <div class="balance-amount" id="balance">0 <span>RB</span></div>
        </div>

        <!-- Кнопка клика -->
        <button class="click-button" onclick="clickCoin()">👆 КЛИКАЙ!</button>

        <!-- Статистика -->
        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-value" id="clicks">0</div>
                <div class="stat-label">Клики</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="level">1</div>
                <div class="stat-label">Уровень</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="perClick">+1</div>
                <div class="stat-label">За клик</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="nextFire">10:00</div>
                <div class="stat-label">До огонька</div>
            </div>
        </div>

        <!-- Улучшение -->
        <button class="upgrade-button" onclick="upgrade()">⬆️ Улучшить (100 RB)</button>

        <!-- Сообщения -->
        <div id="message" class="message"></div>
    </div>

    <script>
        // Игровые переменные
        let balance = 0;
        let clicks = 0;
        let level = 1;
        let perClick = 1;
        let boostActive = false;
        let boostTimeLeft = 0;
        let fireTimer = 600; // 10 минут = 600 секунд
        let fireVisible = false;

        // Создание звёзд
        function createStars() {
            const container = document.getElementById('starsContainer');
            const starsCount = 100; // Количество звёзд

            for (let i = 0; i < starsCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';

                // Случайная позиция и скорость
                const left = Math.random() * 100;
                const duration = 5 + Math.random() * 10;
                const delay = Math.random() * 10;
                const size = 1 + Math.random() * 2;

                star.style.left = left + '%';
                star.style.animationDuration = duration + 's';
                star.style.animationDelay = delay + 's';
                star.style.width = size + 'px';
                star.style.height = size + 'px';

                container.appendChild(star);
            }
        }

        // Создание огонька
        function spawnFire() {
            if (fireVisible) return;

            const fire = document.createElement('div');
            fire.className = 'fire-sticker';
            fire.textContent = '🔥';
            fire.id = 'fireSticker';

            // Случайная позиция
            const x = 20 + Math.random() * 60;
            const y = 10 + Math.random() * 70;
            fire.style.left = x + '%';
            fire.style.top = y + '%';

            // Клик по огоньку
            fire.onclick = function() {
                activateBoost();
                this.remove();
                fireVisible = false;
                document.getElementById('nextFire').textContent = '10:00';
                fireTimer = 600;
                showMessage('🔥 БУСТ x2 АКТИВИРОВАН!', 'success');
            };

            document.body.appendChild(fire);
            fireVisible = true;
        }

        // Активация буста
        function activateBoost() {
            boostActive = true;
            boostTimeLeft = 240; // 4 минуты = 240 секунд
            document.getElementById('boostIndicator').classList.add('show');
            updateBoostDisplay();
        }

        // Обновление таймера буста
        function updateBoostDisplay() {
            const minutes = Math.floor(boostTimeLeft / 60);
            const seconds = boostTimeLeft % 60;
            document.getElementById('boostTime').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // Функция клика
        function clickCoin() {
            const gain = boostActive ? perClick * 2 : perClick;
            balance += gain;
            clicks++;
            updateUI();

            // Анимация
            const button = document.querySelector('.click-button');
            button.style.transform = 'scale(0.9)';
            setTimeout(() => {
                button.style.transform = 'scale(1)';
            }, 100);

            // Визуальный эффект при бусте
            if (boostActive) {
                button.style.boxShadow = '0 0 30px rgba(255, 69, 0, 0.8)';
                setTimeout(() => {
                    button.style.boxShadow = '';
                }, 200);
            }
        }

        // Функция улучшения
        function upgrade() {
            const cost = level * 100;
            if (balance >= cost) {
                balance -= cost;
                level++;
                perClick = level;
                updateUI();
                showMessage('✅ Уровень повышен!', 'success');
            } else {
                showMessage(`❌ Нужно ${cost} RB`, 'error');
            }
        }

        // Обновление интерфейса
        function updateUI() {
            document.getElementById('balance').innerHTML = `${balance} <span>RB</span>`;
            document.getElementById('clicks').textContent = clicks;
            document.getElementById('level').textContent = level;
            document.getElementById('perClick').textContent = `+${perClick}`;
        }

        // Показ сообщений
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message show ${type}`;
            setTimeout(() => {
                msg.className = 'message';
            }, 2000);
        }

        // Главный таймер
        setInterval(() => {
            // Таймер огонька
            if (!fireVisible && fireTimer > 0) {
                fireTimer--;
                const minutes = Math.floor(fireTimer / 60);
                const seconds = fireTimer % 60;
                document.getElementById('nextFire').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                // Спавн огонька через 10 минут
                if (fireTimer === 0) {
                    spawnFire();
                }
            }

            // Таймер буста
            if (boostActive && boostTimeLeft > 0) {
                boostTimeLeft--;
                updateBoostDisplay();

                if (boostTimeLeft === 0) {
                    boostActive = false;
                    document.getElementById('boostIndicator').classList.remove('show');
                    showMessage('⏰ Буст закончился!', 'error');
                }
            }
        }, 1000);

        // Загрузка игры
        createStars();
        updateUI();
    </script>
</body>
</html>
